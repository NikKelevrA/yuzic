# Walks first-run onboarding and connects to the public Navidrome demo
# server (demo.navidrome.org), landing on the authenticated tab shell.
# Requires fresh app state (no server configured yet). On a release build,
# uninstalling/reinstalling is enough; on an Expo dev build, clear only the
# app's MMKV storage instead of full app state so the dev client keeps its
# saved Metro URL (see README).
appId: com.arinora.rawarr
---
- launchApp

# Expo dev builds show a one-time dev-menu overlay on first bundle load.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- extendedWaitUntil:
    visible: "Get Started"
    timeout: 60000
- tapOn: "Get Started"

- extendedWaitUntil:
    visible: "Add Server"
    timeout: 15000
- tapOn: "Add Server"

- extendedWaitUntil:
    visible: "Navidrome"
    timeout: 15000
- tapOn: "Navidrome"

- extendedWaitUntil:
    visible: "Use Navidrome demo"
    timeout: 15000
- tapOn: "Use Navidrome demo"

# Opt-in for Deezer/ListenBrainz discovery, shown once after connecting
# (added after this flow was written). "Not now" keeps the run offline-first
# and leaves nothing enabled that the other suites don't expect.
# Always shown on a fresh install, which this flow requires; waited for rather
# than checked with `when`, since it appears only once the demo connects.
- extendedWaitUntil:
    visible:
      id: "onboarding-discovery-not-now"
    timeout: 30000
- tapOn:
    id: "onboarding-discovery-not-now"

- extendedWaitUntil:
    visible:
      id: "library-tab"
    timeout: 60000
